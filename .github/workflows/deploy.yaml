name: Build Test Deploy

permissions:
  contents: write
  packages: write

on:
  pull_request:
    types: [closed]

jobs:

  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build -x javadoc

      # -----------------------------
      # Create tag
      # -----------------------------

      - name: Create Git Tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          TAG=v1.${{ github.run_number }}

          git tag $TAG
          git push origin $TAG

      # -----------------------------
      # Docker login
      # -----------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Build Docker image
      # -----------------------------
      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/ludenedev/flowershopapi/flowershop:latest .

      - name: Push Docker Image
        run: |
          docker push ghcr.io/ludenedev/flowershopapi/flowershop:latest

      # -----------------------------
      # Push Docker image
      # -----------------------------

      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ github.repository }}/flowershop:latest

      # -----------------------------
      # Trigger Render deploy
      # -----------------------------

      - name: Deploy to Render
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_deploy: true