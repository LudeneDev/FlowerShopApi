name: Build Test Deploy

permissions:
  contents: write
  packages: write

on:
  pull_request:
    types: [closed]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build -x javadoc

      - name: Create Git Tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          TAG=v1.${{ github.run_number }}

          git tag $TAG
          git push origin $TAG

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/ludenedev/flowershopapi:${IMAGE_TAG} \
            -t ghcr.io/ludenedev/flowershopapi:latest \
            .

      - name: Push Docker Images
        run: |
          docker push ghcr.io/ludenedev/flowershopapi:${IMAGE_TAG}
          docker push ghcr.io/ludenedev/flowershopapi:latest

      - name: Trigger Render Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}